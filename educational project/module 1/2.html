<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Основы Веб-разработки</title>
    <style>
        :root {
            --primary: #8B5CF6; /* Фиолетовый */
            --primary-light: #A78BFA;
            --primary-dark: #7C3AED;
            --success: #10B981; /* Изумрудный */
            --error: #F43F5E; /* Розовый */
            --warning: #F59E0B; /* Янтарный */
            --bg: #F8FAFC; /* Светло-серый */
            --card: #FFFFFF;
            --text: #1F2937; /* Темно-серый */
            --text-light: #6B7280;
            --border: #E5E7EB;
            --hover-bg: #F5F3FF; /* Светло-фиолетовый */
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #F3F4F6 0%, #F8FAFC 100%);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .quiz-container {
            background: var(--card);
            width: 100%;
            max-width: 700px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(139, 92, 246, 0.1);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(139, 92, 246, 0.1);
        }

        .quiz-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary), var(--success), var(--warning));
        }

        /* Индикаторы */
        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        #question-number {
            background: var(--primary-light);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        #timer {
            color: var(--text-light);
            font-weight: 500;
        }

        .progress-container {
            height: 10px;
            background: var(--border);
            border-radius: 5px;
            margin-bottom: 35px;
            overflow: hidden;
            position: relative;
        }

        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 5px;
            position: relative;
        }

        #progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Вопросы */
        .question-text {
            font-size: 1.35rem;
            margin-bottom: 30px;
            line-height: 1.5;
            color: var(--text);
            font-weight: 600;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            margin-bottom: 14px;
            padding: 18px 20px;
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            background: white;
            position: relative;
            overflow: hidden;
        }

        .option-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--primary);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .option-item:hover {
            border-color: var(--primary);
            background: var(--hover-bg);
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.1);
        }

        .option-item:hover::before {
            transform: scaleY(1);
        }

        .option-item input {
            margin-right: 16px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        /* Кнопки */
        .controls {
            margin-top: 40px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        button {
            padding: 14px 32px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%);
            transform-origin: 50% 50%;
        }

        button:focus:not(:active)::after {
            animation: ripple 1s ease-out;
        }

        @keyframes ripple {
            0% { transform: scale(0, 0); opacity: 0.5; }
            100% { transform: scale(40, 40); opacity: 0; }
        }

        .btn-next {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            min-width: 140px;
        }

        .btn-next:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3);
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
        }

        .btn-next:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-next:disabled {
            background: var(--border);
            color: var(--text-light);
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* Результаты */
        .hidden {
            display: none;
        }

        .result-item {
            padding: 20px;
            margin-top: 15px;
            border-radius: 12px;
            border-left: 6px solid;
            position: relative;
            animation: slideIn 0.5s ease-out;
            animation-fill-mode: both;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .res-correct {
            background: linear-gradient(135deg, #D1FAE5, #ECFDF5);
            border-color: var(--success);
        }

        .res-wrong {
            background: linear-gradient(135deg, #FEE2E2, #FEF2F2);
            border-color: var(--error);
        }

        #result-screen h2 {
            color: var(--text);
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 2rem;
            background: linear-gradient(135deg, var(--primary), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #score-text {
            font-size: 1.8rem;
            margin-bottom: 30px;
            font-weight: 700;
            color: var(--text);
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #F5F3FF, #F0F9FF);
            border-radius: 16px;
            border: 2px dashed var(--border);
        }

        @media (max-width: 768px) {
            .quiz-container {
                padding: 25px;
                border-radius: 20px;
            }

            .question-text {
                font-size: 1.2rem;
            }

            .controls {
                flex-direction: column;
            }

            .btn-next {
                width: 100%;
            }

            .option-item {
                padding: 16px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .quiz-container {
                padding: 20px;
            }

            .question-text {
                font-size: 1.1rem;
            }

            .option-item {
                padding: 14px;
                margin-bottom: 10px;
            }
        }

        /* Дополнительные стили для текста в результатах */
        #result-screen strong {
            color: var(--text);
            font-weight: 700;
        }

        #result-screen br {
            margin: 8px 0;
        }

        /* Стили для заголовка результатов */
        .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .result-header svg {
            width: 32px;
            height: 32px;
            color: var(--primary);
        }

        /* Анимация загрузки */
        .loading {
            position: relative;
            overflow: hidden;
        }

        .loading::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { left: -100%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-screen">
        <div class="header-info">
            <span id="question-number">Вопрос 1 из 10</span>
            <span id="timer">Время: 00:00</span>
        </div>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>

        <div id="question-container">
            </div>
        <div class="controls">
            <button id="next-btn" class="btn-next">Далее →</button>
        </div>
    </div>

    <div id="result-screen" class="hidden">
        <div class="result-header">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <h2>Ваш результат</h2>
        </div>
        <div id="score-text"></div>
        <div id="review-container"></div>
        <button onclick="location.reload()" class="btn-next" style="margin-top: 30px; width: 100%;">⟳ Пройти заново</button>
    </div>
</div>

<script>
    const questions = [
        {
            question: "Какой тег используется для создания ссылки?",
            type: "single",
            options: ["&lt;link&gt;", "&lt;a&gt;", "&lt;href&gt;", "&lt;url&gt;"],
            correct: 1,
            points: 1
        },
        {
            question: "Выберите все логические операторы в JS:",
            type: "multiple",
            options: ["&&", "||", "==", "!"],
            correct: [0, 1, 3],
            points: 2
        },
        {
            question: "Как расшифровывается CSS?",
            type: "text",
            correct: "Cascading Style Sheets",
            points: 1
        },
        {
            question: "Какой метод превращает JSON-строку в объект?",
            type: "single",
            options: ["JSON.stringify()", "JSON.toObject()", "JSON.parse()", "JSON.convert()"],
            correct: 2,
            points: 1
        },
        {
            question: "Какие значения являются 'falsy' в JavaScript?",
            type: "multiple",
            options: ["0", "[]", "null", "undefined"],
            correct: [0, 2, 3],
            points: 2
        },
        {
            question: "Напишите название самого популярного менеджера пакетов для Node.js (3 буквы):",
            type: "text",
            correct: "npm",
            points: 1
        },
        {
            question: "Какое свойство CSS отвечает за внутренние отступы?",
            type: "single",
            options: ["margin", "border", "padding", "spacing"],
            correct: 2,
            points: 1
        },
        {
            question: "Выберите типы данных в JS:",
            type: "multiple",
            options: ["Boolean", "Float", "Symbol", "Number"],
            correct: [0, 2, 3],
            points: 2
        },
        {
            question: "Чему равно 2 + '2' в JavaScript?",
            type: "text",
            correct: "22",
            points: 1
        },
        {
            question: "В каком году появился JavaScript?",
            type: "single",
            options: ["1990", "1995", "2000", "2005"],
            correct: 1,
            points: 1
        }
    ];

    let currentIdx = 0;
    let score = 0;
    let userAnswers = [];
    let startTime;
    let timerInterval;

    const qContainer = document.getElementById('question-container');
    const nextBtn = document.getElementById('next-btn');
    const progressBar = document.getElementById('progress-bar');
    const qNumberLabel = document.getElementById('question-number');
    const timerLabel = document.getElementById('timer');

    function startTimer() {
        startTime = Date.now();
        timerInterval = setInterval(() => {
            const delta = Date.now() - startTime;
            const sec = Math.floor(delta / 1000) % 60;
            const min = Math.floor(delta / 60000);
            timerLabel.innerText = `Время: ${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
        }, 1000);
    }

    function renderQuestion() {
        const q = questions[currentIdx];
        qNumberLabel.innerText = `Вопрос ${currentIdx + 1} из ${questions.length}`;
        progressBar.style.width = `${((currentIdx) / questions.length) * 100}%`;

        let html = `<div class="question-text">${q.question}</div>`;

        if (q.type === 'single' || q.type === 'multiple') {
            html += `<div class="options-list">`;
            q.options.forEach((opt, i) => {
                const inputType = q.type === 'single' ? 'radio' : 'checkbox';
                html += `
                    <label class="option-item">
                        <input type="${inputType}" name="answer" value="${i}">
                        <span>${opt}</span>
                    </label>
                `;
            });
            html += `</div>`;
        } else {
            html += `<input type="text" id="text-answer" placeholder="Введите ваш ответ..." autocomplete="off">`;
        }

        qContainer.innerHTML = html;

        // Фокус на текстовом поле
        if (q.type === 'text') {
            setTimeout(() => document.getElementById('text-answer').focus(), 100);
        }
    }

    nextBtn.onclick = () => {
        const q = questions[currentIdx];
        let answer;

        if (q.type === 'single') {
            const selected = document.querySelector('input[name="answer"]:checked');
            if (!selected) {
                alert("Выберите ответ!");
                return;
            }
            answer = parseInt(selected.value);
        } else if (q.type === 'multiple') {
            const selected = Array.from(document.querySelectorAll('input[name="answer"]:checked')).map(el => parseInt(el.value));
            if (selected.length === 0) {
                alert("Выберите хотя бы один вариант!");
                return;
            }
            answer = selected;
        } else {
            answer = document.getElementById('text-answer').value.trim();
            if (!answer) {
                alert("Введите ответ!");
                return;
            }
        }

        userAnswers.push(answer);
        currentIdx++;

        if (currentIdx < questions.length) {
            renderQuestion();
        } else {
            showResults();
        }
    };

    function showResults() {
        clearInterval(timerInterval);
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        let totalPoints = 0;
        let earnedPoints = 0;
        let reviewHtml = '';

        questions.forEach((q, i) => {
            totalPoints += q.points;
            let isCorrect = false;
            const uAns = userAnswers[i];

            if (q.type === 'single') isCorrect = uAns === q.correct;
            else if (q.type === 'multiple') {
                isCorrect = JSON.stringify(uAns.sort()) === JSON.stringify(q.correct.sort());
            } else {
                isCorrect = uAns.toLowerCase() === q.correct.toLowerCase();
            }

            if (isCorrect) earnedPoints += q.points;

            // Форматирование ответов для отображения
            let userAnswerText;
            if (q.type === 'text') {
                userAnswerText = uAns;
            } else if (Array.isArray(uAns)) {
                userAnswerText = uAns.map(idx => q.options[idx]).join(', ');
            } else {
                userAnswerText = q.options[uAns];
            }

            let correctAnswerText;
            if (q.type === 'text') {
                correctAnswerText = q.correct;
            } else if (Array.isArray(q.correct)) {
                correctAnswerText = q.correct.map(idx => q.options[idx]).join(', ');
            } else {
                correctAnswerText = q.options[q.correct];
            }

            reviewHtml += `
                <div class="result-item ${isCorrect ? 'res-correct' : 'res-wrong'}" style="animation-delay: ${i * 0.1}s">
                    <strong>${i+1}. ${q.question}</strong><br>
                    <strong>Ваш ответ:</strong> ${userAnswerText}<br>
                    ${!isCorrect ? `<strong>Правильный ответ:</strong> ${correctAnswerText}` : '<strong>✅ Верно!</strong>'}
                </div>
            `;
        });

        const percent = Math.round((earnedPoints / totalPoints) * 100);
        let emoji = '🎯';
        if (percent >= 90) emoji = '🏆';
        else if (percent >= 70) emoji = '⭐';
        else if (percent >= 50) emoji = '👍';
        else emoji = '💪';

        document.getElementById('score-text').innerHTML = `${emoji} Баллы: <strong>${earnedPoints}</strong> / <strong>${totalPoints}</strong> (${percent}%)`;
        document.getElementById('review-container').innerHTML = reviewHtml;
    }

    // Инициализация
    renderQuestion();
    startTimer();
</script>

</body>
</html>
